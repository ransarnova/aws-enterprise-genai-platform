
name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run repository checks
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files

  secret-scanning:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.30.1"

          curl --fail --location --silent --show-error \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          mkdir -p /tmp/gitleaks-bin
          tar -xzf gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks

          sudo install -m 0755 \
            /tmp/gitleaks-bin/gitleaks \
            /usr/local/bin/gitleaks

          gitleaks version

      - name: Scan complete Git history
        run: gitleaks git --redact --verbose .
