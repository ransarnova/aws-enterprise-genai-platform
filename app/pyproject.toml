[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-enterprise-genai-platform"
version = "0.1.0"
description = "Reusable enterprise GenAI platform reference implementation on AWS"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "boto3>=1.37,<2.0",
    "pydantic-settings>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Python modernization
]

[tool.ruff.lint.isort]
known-first-party = ["genai_platform"]
