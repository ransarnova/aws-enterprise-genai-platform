
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-platform-api
  namespace: genai-platform
  labels:
    app.kubernetes.io/name: genai-platform-api
    app.kubernetes.io/part-of: enterprise-genai-platform
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: genai-platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genai-platform-api
        app.kubernetes.io/part-of: enterprise-genai-platform
    spec:
      serviceAccountName: genai-platform-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: lab
            - name: AWS_REGION
              value: ap-south-1
            - name: BEDROCK_MODEL_ID
              value: "apac.amazon.nova-micro-v1:0"
            - name: BEDROCK_KNOWLEDGE_BASE_ID
              value: "REPLACE_WITH_KNOWLEDGE_BASE_ID"
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
