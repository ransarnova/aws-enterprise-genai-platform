repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks - Detect staged secrets
        entry: gitleaks git --staged --redact --verbose .
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
